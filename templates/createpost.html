<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание поста - Моя Галерея</title>
    <link rel="stylesheet" href="{% static 'css/createpost.css' %}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Создание нового поста</h1>
            <p>Выберите картинки из галереи для вашего поста</p>
        </div>

        <div class="nav-links">
            <a href="/api/home/">🏠 Главная</a>
            <a href="/api/profile/">👤 Мой профиль</a>
        </div>

        <div class="controls">
            <div class="input-group">
                <input type="text" id="postTitle" placeholder="Введите название поста..." autocomplete="off">
                <button class="btn btn-primary" id="submitPostBtn">✨ Создать пост</button>
                <button class="btn btn-secondary" id="clearSelectionBtn">🗑️ Очистить выбор</button>
            </div>
            <div class="selection-info">
                <span class="selected-count" id="selectedCount">Выбрано: 0</span>
                <span class="badge" id="selectionPreview">Ничего не выбрано</span>
            </div>
        </div>

        <div id="gallery" class="gallery">
            <div class="loading">Загрузка галереи...</div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        class PostCreator {
            constructor() {
                this.pictures = [];
                this.selectedPictureIds = [];
                this.isAuthenticated = false;
                this.init();
            }

            init() {
                this.checkAuthAndLoad();
                this.attachEventListeners();
            }

            attachEventListeners() {
                const submitBtn = document.getElementById('submitPostBtn');
                const clearBtn = document.getElementById('clearSelectionBtn');
                const titleInput = document.getElementById('postTitle');

                if (submitBtn) {
                    submitBtn.addEventListener('click', () => this.createPost());
                }

                if (clearBtn) {
                    clearBtn.addEventListener('click', () => this.clearSelection());
                }

                if (titleInput) {
                    titleInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            this.createPost();
                        }
                    });
                }
            }

            async checkAuthAndLoad() {
                const galleryContainer = document.getElementById('gallery');
                const controls = document.querySelector('.controls');

                try {
                    // Сначала проверяем авторизацию через отдельный эндпоинт
                    const authCheckResponse = await fetch('/api/user/check-auth/', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    if (authCheckResponse.ok) {
                        const authData = await authCheckResponse.json();
                        this.isAuthenticated = authData.is_authenticated;
                    }

                    if (!this.isAuthenticated) {
                        // Скрываем форму создания поста
                        if (controls) controls.style.display = 'none';

                        galleryContainer.innerHTML = `
                            <div class="empty-state" style="grid-column: 1 / -1; background: white; padding: 60px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                                <div style="font-size: 64px; margin-bottom: 20px;">🔒</div>
                                <h2 style="color: #667eea; margin-bottom: 15px;">Доступ ограничен</h2>
                                <p style="color: #666; margin-bottom: 25px;">Чтобы создавать посты и выбирать картинки, необходимо войти в аккаунт.</p>
                                <div class="nav-links" style="justify-content: center;">
                                    <a href="/login/" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 30px; text-decoration: none; border-radius: 10px; display: inline-block;">🔑 Войти в профиль</a>
                                </div>
                            </div>
                        `;
                        return;
                    }

                    // Если пользователь авторизован, загружаем галерею
                    await this.loadUserGallery();

                } catch (error) {
                    console.error('Ошибка проверки авторизации:', error);
                    // В случае ошибки проверки, пробуем загрузить галерею напрямую
                    await this.loadUserGallery();
                }
            }

            async loadUserGallery() {
                const galleryContainer = document.getElementById('gallery');
                const controls = document.querySelector('.controls');

                try {
                    const response = await fetch('/api/createpost/getpictures/');

                    if (response.status === 401) {
                        // Сервер вернул 401 - пользователь не авторизован
                        if (controls) controls.style.display = 'none';

                        galleryContainer.innerHTML = `
                            <div class="empty-state" style="grid-column: 1 / -1; background: white; padding: 60px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                                <div style="font-size: 64px; margin-bottom: 20px;">🔒</div>
                                <h2 style="color: #667eea; margin-bottom: 15px;">Требуется авторизация</h2>
                                <p style="color: #666; margin-bottom: 25px;">Пожалуйста, войдите в аккаунт для доступа к галерее</p>
                                <div class="nav-links" style="justify-content: center;">
                                    <a href="/login/" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 30px; text-decoration: none; border-radius: 10px; display: inline-block;">🔑 Войти</a>
                                    <a href="/register/" style="background: #6c757d; color: white; padding: 12px 30px; text-decoration: none; border-radius: 10px; display: inline-block; margin-left: 10px;">📝 Регистрация</a>
                                </div>
                            </div>
                        `;
                        return;
                    }

                    if (!response.ok) throw new Error('Ошибка сервера');

                    const data = await response.json();
                    this.pictures = Array.isArray(data) ? data : (data.results || []);
                    this.renderGallery();

                } catch (error) {
                    console.error('Ошибка:', error);
                    galleryContainer.innerHTML = `
                        <div class="empty-gallery" style="grid-column: 1 / -1;">
                            ❌ Ошибка загрузки данных: ${error.message}
                            <br><br>
                            <button onclick="location.reload()" style="padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 10px; cursor: pointer;">🔄 Попробовать снова</button>
                        </div>
                    `;
                }
            }

            renderGallery() {
                const galleryContainer = document.getElementById('gallery');

                if (!this.pictures || this.pictures.length === 0) {
                    galleryContainer.innerHTML = `
                        <div class="empty-gallery">
                            🖼️ У вас пока нет картинок в галерее<br>
                            <small>Загрузите картинки в профиле, чтобы создать пост</small>
                            <br><br>
                            <a href="/api/profile/" class="btn btn-primary" style="display: inline-block; text-decoration: none; padding: 10px 20px;">📤 Загрузить картинки</a>
                        </div>
                    `;
                    return;
                }

                galleryContainer.innerHTML = this.pictures.map(picture => {
                    const imageUrl = picture.image || picture.image_url || picture.url || 'https://via.placeholder.com/250';
                    const pictureId = picture.id;
                    const pictureTitle = picture.title || `Картинка ${pictureId}`;

                    return `
                        <div class="gallery-item" data-id="${pictureId}">
                            <img src="${imageUrl}"
                                 alt="${pictureTitle}"
                                 onerror="this.src='https://via.placeholder.com/250?text=No+Image'">
                            <div class="selection-overlay"></div>
                            <div class="gallery-item-info">
                                ${this.escapeHtml(pictureTitle)}
                            </div>
                        </div>
                    `;
                }).join('');

                document.querySelectorAll('.gallery-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.togglePictureSelection(item);
                    });
                });
            }

            togglePictureSelection(element) {
                const pictureId = parseInt(element.dataset.id);

                if (this.selectedPictureIds.includes(pictureId)) {
                    this.selectedPictureIds = this.selectedPictureIds.filter(id => id !== pictureId);
                    element.classList.remove('selected');
                    this.showToast(`Картинка удалена из выбора`, 'info');
                } else {
                    this.selectedPictureIds.push(pictureId);
                    element.classList.add('selected');
                    this.showToast(`Картинка добавлена в выбор`, 'success');
                }

                this.updateSelectionUI();
            }

            updateSelectionUI() {
                const selectedCount = document.getElementById('selectedCount');
                const selectionPreview = document.getElementById('selectionPreview');

                if (selectedCount) {
                    selectedCount.textContent = `Выбрано: ${this.selectedPictureIds.length}`;
                }

                if (selectionPreview) {
                    if (this.selectedPictureIds.length === 0) {
                        selectionPreview.textContent = 'Ничего не выбрано';
                        selectionPreview.style.background = '#6c757d';
                    } else if (this.selectedPictureIds.length <= 3) {
                        selectionPreview.textContent = `Выбраны: ${this.selectedPictureIds.join(', ')}`;
                        selectionPreview.style.background = '#28a745';
                    } else {
                        selectionPreview.textContent = `Выбрано ${this.selectedPictureIds.length} картинок`;
                        selectionPreview.style.background = '#28a745';
                    }
                }
            }

            async createPost() {
                const titleInput = document.getElementById('postTitle');
                const title = titleInput ? titleInput.value.trim() : '';

                if (!title) {
                    this.showToast('Пожалуйста, введите название поста', 'error');
                    titleInput?.focus();
                    return false;
                }

                if (this.selectedPictureIds.length === 0) {
                    this.showToast('Пожалуйста, выберите хотя бы одну картинку', 'error');
                    return false;
                }

                const submitBtn = document.getElementById('submitPostBtn');
                const originalBtnText = submitBtn?.textContent;
                if (submitBtn) {
                    submitBtn.textContent = '⏳ Создание...';
                    submitBtn.disabled = true;
                }

                try {
                    const postData = {
                        title: title,
                        pictures: this.selectedPictureIds
                    };

                    console.log('Отправляемые данные:', postData);

                    const response = await fetch('/api/createpost/addpost/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': this.getCookie('csrftoken')
                        },
                        body: JSON.stringify(postData)
                    });

                    // Обработка ответа от сервера
                    if (response.status === 401) {
                        const errorData = await response.json();

                        // Проверяем, содержит ли ответ данные о необходимости авторизации
                        if (errorData.requires_auth || errorData.error === 'unauthorized') {
                            this.showToast('❌ Необходимо авторизоваться', 'error');

                            // Предлагаем пользователю войти
                            setTimeout(() => {
                                const shouldRedirect = confirm('Необходимо войти в аккаунт. Перейти на страницу входа?');
                                if (shouldRedirect) {
                                    const redirectUrl = errorData.redirect_url || '/login/';
                                    window.location.href = redirectUrl;
                                }
                            }, 500);

                            return false;
                        } else {
                            this.showToast('❌ Сессия истекла, пожалуйста, войдите снова', 'error');
                            setTimeout(() => {
                                window.location.href = '/login/';
                            }, 1500);
                            return false;
                        }
                    }

                    if (response.ok) {
                        const newPost = await response.json();
                        this.showToast(`✅ Пост "${title}" успешно создан!`, 'success');

                        if (titleInput) titleInput.value = '';
                        this.clearSelection();

                        setTimeout(() => {
                            if (confirm('Пост создан! Перейти к списку постов?')) {
                                window.location.href = '/api/home/';
                            }
                        }, 500);

                        return true;
                    } else {
                        const error = await response.json();
                        console.error('Ошибка сервера:', error);
                        throw new Error(error.message || error.error || 'Ошибка создания поста');
                    }
                } catch (error) {
                    console.error('Ошибка создания поста:', error);
                    this.showToast(`❌ Ошибка: ${error.message}`, 'error');
                    return false;
                } finally {
                    if (submitBtn) {
                        submitBtn.textContent = originalBtnText;
                        submitBtn.disabled = false;
                    }
                }
            }

            clearSelection() {
                this.selectedPictureIds = [];
                document.querySelectorAll('.gallery-item').forEach(item => {
                    item.classList.remove('selected');
                });
                this.updateSelectionUI();
                this.showToast('Выбор очищен', 'info');
            }

            showToast(message, type = 'info') {
                const toast = document.getElementById('toast');
                if (!toast) return;

                toast.textContent = message;
                toast.className = `toast ${type}`;
                toast.classList.add('show');

                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            getCookie(name) {
                let cookieValue = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, name.length + 1) === (name + '=')) {
                            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                            break;
                        }
                    }
                }
                return cookieValue;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            new PostCreator();
        });
    </script>
</body>
</html>
