<!-- templates/createpost.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание поста</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .form-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .form-body {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        label .required {
            color: #e74c3c;
        }

        input[type="text"],
        input[type="url"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .image-preview {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .preview-item {
            position: relative;
            background: #f5f5f5;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-image {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-add-image {
            background: #f0f0f0;
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add-image:hover {
            border-color: #667eea;
            background: #f8f9ff;
            color: #667eea;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="form-header">
                <h1>📝 Создать новый пост</h1>
                <p>Поделитесь своей историей с миром</p>
            </div>
            <div class="form-body">
                <div id="message" class="message"></div>

                <form id="postForm">
                    {% csrf_token %}

                    <div class="form-group">
                        <label for="title">
                            Заголовок <span class="required">*</span>
                        </label>
                        <input
                            type="text"
                            id="title"
                            name="title"
                            required
                            placeholder="Введите заголовок поста..."
                            maxlength="200"
                        >
                    </div>

                    <div class="form-group">
                        <label for="content">
                            Содержание
                        </label>
                        <textarea
                            id="content"
                            name="content"
                            placeholder="Напишите что-нибудь интересное..."
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="pictures">
                            Изображения
                        </label>
                        <div id="imageInputs">
                            <div class="image-input-group" style="margin-bottom: 10px;">
                                <input
                                    type="url"
                                    class="image-url"
                                    placeholder="Введите URL изображения..."
                                    style="margin-bottom: 10px;"
                                >
                            </div>
                        </div>
                        <button type="button" class="btn-add-image" onclick="addImageField()">
                            + Добавить еще изображение
                        </button>
                        <div id="imagePreview" class="image-preview"></div>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">
                        Создать пост
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let imageUrls = [];

        function addImageField() {
            const container = document.getElementById('imageInputs');
            const newGroup = document.createElement('div');
            newGroup.className = 'image-input-group';
            newGroup.style.marginBottom = '10px';
            newGroup.innerHTML = `
                <input
                    type="url"
                    class="image-url"
                    placeholder="Введите URL изображения..."
                    style="margin-bottom: 10px;"
                >
            `;
            container.appendChild(newGroup);

            const newInput = newGroup.querySelector('.image-url');
            newInput.addEventListener('change', updateImagePreviews);
            newInput.addEventListener('input', updateImagePreviews);
        }

        function updateImagePreviews() {
            const inputs = document.querySelectorAll('.image-url');
            imageUrls = [];

            inputs.forEach(input => {
                const url = input.value.trim();
                if (url) {
                    imageUrls.push(url);
                }
            });

            const previewContainer = document.getElementById('imagePreview');
            previewContainer.innerHTML = '';

            imageUrls.forEach((url, index) => {
                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';
                previewItem.innerHTML = `
                    <img src="${url}" alt="Preview ${index + 1}" onerror="this.src='https://via.placeholder.com/100?text=Invalid+URL'">
                    <button type="button" class="remove-image" onclick="removeImage(${index})">×</button>
                `;
                previewContainer.appendChild(previewItem);
            });
        }

        function removeImage(index) {
            const inputs = document.querySelectorAll('.image-url');
            if (inputs[index]) {
                inputs[index].value = '';
                updateImagePreviews();
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="loading"></span> Создание...';
            submitBtn.disabled = true;

            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();

            const pictures = [];
            document.querySelectorAll('.image-url').forEach(input => {
                const url = input.value.trim();
                if (url) {
                    pictures.push(url);
                }
            });

            if (!title) {
                showMessage('Пожалуйста, введите заголовок', 'error');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                return;
            }

            const postData = {
                title: title,
                pictures: pictures,
                created_at: new Date().toISOString()
            };

            if (content) {
                postData.content = content;
            }

            try {
                const response = await fetch('/api/createpost/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify(postData)
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('Пост успешно создан! 🎉', 'success');
                    document.getElementById('postForm').reset();
                    updateImagePreviews();

                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else if (response.status === 401) {
                    showMessage('Требуется авторизация. Перенаправление...', 'error');
                    setTimeout(() => {
                        window.location.href = '/login/';
                    }, 2000);
                } else {
                    showMessage('Ошибка: ' + JSON.stringify(data), 'error');
                }
            } catch (error) {
                showMessage('Произошла ошибка при отправке', 'error');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const firstImageInput = document.querySelector('.image-url');
            if (firstImageInput) {
                firstImageInput.addEventListener('change', updateImagePreviews);
                firstImageInput.addEventListener('input', updateImagePreviews);
            }
        });
    </script>
</body>
</html>
