<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание поста - Моя Галерея</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .nav-links {
            background: #f8f9fa;
            padding: 15px 30px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #764ba2;
        }

        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .selection-info {
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .selected-count {
            font-weight: bold;
            color: #667eea;
            font-size: 18px;
        }

        .badge {
            background: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .gallery {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            background: white;
            max-height: 600px;
            overflow-y: auto;
        }

        .gallery-item {
            position: relative;
            cursor: pointer;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .gallery-item.selected {
            box-shadow: 0 0 0 3px #667eea, 0 0 0 6px rgba(102, 126, 234, 0.3);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .selection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(102, 126, 234, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .gallery-item.selected .selection-overlay {
            opacity: 1;
        }

        .selection-overlay::after {
            content: "✓";
            font-size: 48px;
            color: white;
            font-weight: bold;
        }

        .gallery-item-info {
            padding: 10px;
            background: white;
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #666;
        }

        .loading::after {
            content: "...";
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: "."; }
            40% { content: ".."; }
            60%, 100% { content: "..."; }
        }

        .empty-gallery {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .empty-gallery::before {
            content: "🖼️";
            font-size: 64px;
            display: block;
            margin-bottom: 20px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateX(400px);
            transition: transform 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-left: 4px solid #28a745;
        }

        .toast.error {
            border-left: 4px solid #dc3545;
        }

        .toast.info {
            border-left: 4px solid #17a2b8;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
                padding: 15px;
                max-height: 400px;
            }

            .gallery-item img {
                height: 150px;
            }

            .controls {
                padding: 15px;
            }

            .input-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Создание нового поста</h1>
            <p>Выберите картинки из галереи для вашего поста</p>
        </div>

        <div class="nav-links">
            <a href="/api/home/">🏠 Главная</a>
            <a href="/api/profile/">👤 Мой профиль</a>
            <a href="/api/picture/">🖼️ Мои картинки</a>
            <a href="/api/posts/">📝 Мои посты</a>
        </div>

        <div class="controls">
            <div class="input-group">
                <input type="text" id="postTitle" placeholder="Введите название поста..." autocomplete="off">
                <button class="btn btn-primary" id="submitPostBtn">✨ Создать пост</button>
                <button class="btn btn-secondary" id="clearSelectionBtn">🗑️ Очистить выбор</button>
            </div>
            <div class="selection-info">
                <span class="selected-count" id="selectedCount">Выбрано: 0</span>
                <span class="badge" id="selectionPreview">Ничего не выбрано</span>
            </div>
        </div>

        <div id="gallery" class="gallery">
            <div class="loading">Загрузка галереи</div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        class PostCreator {
            constructor() {
                this.pictures = [];
                this.selectedPictureIds = [];
                this.init();
            }

            init() {
                this.loadUserGallery();
                this.attachEventListeners();
            }

            attachEventListeners() {
                const submitBtn = document.getElementById('submitPostBtn');
                const clearBtn = document.getElementById('clearSelectionBtn');
                const titleInput = document.getElementById('postTitle');

                if (submitBtn) {
                    submitBtn.addEventListener('click', () => this.createPost());
                }

                if (clearBtn) {
                    clearBtn.addEventListener('click', () => this.clearSelection());
                }

                if (titleInput) {
                    titleInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            this.createPost();
                        }
                    });
                }
            }

            async loadUserGallery() {
                const galleryContainer = document.getElementById('gallery');

                try {
                    // Загружаем картинки пользователя
                    const response = await fetch('/api/createpost/getpictures/');

                    if (response.status === 401) {
                        galleryContainer.innerHTML = `
                            <div class="empty-gallery">
                                🔒 Пожалуйста, авторизуйтесь<br>
                                <small><a href="/login/">Войти</a> | <a href="/register/">Регистрация</a></small>
                            </div>
                        `;
                        this.showToast('Необходимо авторизоваться', 'error');
                        return;
                    }

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const data = await response.json();
                    this.pictures = Array.isArray(data) ? data : (data.results || []);

                    this.renderGallery();
                } catch (error) {
                    console.error('Ошибка загрузки галереи:', error);
                    galleryContainer.innerHTML = `
                        <div class="empty-gallery">
                            Ошибка загрузки галереи<br>
                            <small>${error.message}</small>
                        </div>
                    `;
                    this.showToast('Не удалось загрузить галерею', 'error');
                }
            }

            renderGallery() {
                const galleryContainer = document.getElementById('gallery');

                if (!this.pictures || this.pictures.length === 0) {
                    galleryContainer.innerHTML = `
                        <div class="empty-gallery">
                            🖼️ У вас пока нет картинок в галерее<br>
                            <small>Загрузите картинки в профиле, чтобы создать пост</small>
                            <br><br>
                            <a href="/api/profile/" class="btn btn-primary" style="display: inline-block; text-decoration: none; padding: 10px 20px;">Загрузить картинки</a>
                        </div>
                    `;
                    return;
                }

                galleryContainer.innerHTML = this.pictures.map(picture => {
                    const imageUrl = picture.image || picture.image_url || picture.url || 'https://via.placeholder.com/250';
                    const pictureId = picture.id;
                    const pictureTitle = picture.title || `Картинка ${pictureId}`;

                    return `
                        <div class="gallery-item" data-id="${pictureId}">
                            <img src="${imageUrl}"
                                 alt="${pictureTitle}"
                                 onerror="this.src='https://via.placeholder.com/250?text=No+Image'">
                            <div class="selection-overlay"></div>
                            <div class="gallery-item-info">
                                ${pictureTitle}
                            </div>
                        </div>
                    `;
                }).join('');

                document.querySelectorAll('.gallery-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.togglePictureSelection(item);
                    });
                });
            }

            togglePictureSelection(element) {
                const pictureId = parseInt(element.dataset.id);

                if (this.selectedPictureIds.includes(pictureId)) {
                    this.selectedPictureIds = this.selectedPictureIds.filter(id => id !== pictureId);
                    element.classList.remove('selected');
                    this.showToast(`Картинка ${pictureId} удалена из выбора`, 'info');
                } else {
                    this.selectedPictureIds.push(pictureId);
                    element.classList.add('selected');
                    this.showToast(`Картинка ${pictureId} добавлена в выбор`, 'success');
                }

                this.updateSelectionUI();
            }

            updateSelectionUI() {
                const selectedCount = document.getElementById('selectedCount');
                const selectionPreview = document.getElementById('selectionPreview');

                if (selectedCount) {
                    selectedCount.textContent = `Выбрано: ${this.selectedPictureIds.length}`;
                }

                if (selectionPreview) {
                    if (this.selectedPictureIds.length === 0) {
                        selectionPreview.textContent = 'Ничего не выбрано';
                        selectionPreview.style.background = '#6c757d';
                    } else if (this.selectedPictureIds.length <= 3) {
                        selectionPreview.textContent = `Выбраны: ${this.selectedPictureIds.join(', ')}`;
                        selectionPreview.style.background = '#28a745';
                    } else {
                        selectionPreview.textContent = `Выбрано ${this.selectedPictureIds.length} картинок`;
                        selectionPreview.style.background = '#28a745';
                    }
                }
            }

            async createPost() {
                const titleInput = document.getElementById('postTitle');
                const title = titleInput ? titleInput.value.trim() : '';

                if (!title) {
                    this.showToast('Пожалуйста, введите название поста', 'error');
                    titleInput?.focus();
                    return false;
                }

                if (this.selectedPictureIds.length === 0) {
                    this.showToast('Пожалуйста, выберите хотя бы одну картинку', 'error');
                    return false;
                }

                const submitBtn = document.getElementById('submitPostBtn');
                const originalBtnText = submitBtn?.textContent;
                if (submitBtn) {
                    submitBtn.textContent = '⏳ Создание...';
                    submitBtn.disabled = true;
                }

                try {
                    const response = await fetch('/api/createpost/addpost/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': this.getCookie('csrftoken')
                        },
                        body: JSON.stringify({
                            title: title,
                            pictures: this.selectedPictureIds
                        })
                    });

                    if (response.status === 401) {
                        this.showToast('❌ Необходимо авторизоваться', 'error');
                        return false;
                    }

                    if (response.ok) {
                        const newPost = await response.json();
                        this.showToast(`✅ Пост "${title}" успешно создан!`, 'success');

                        if (titleInput) titleInput.value = '';
                        this.clearSelection();

                        setTimeout(() => {
                            if (confirm('Пост создан! Перейти к списку постов?')) {
                                window.location.href = '/api/home/';
                            }
                        }, 500);

                        return true;
                    } else {
                        const error = await response.json();
                        throw new Error(error.message || error.error || 'Ошибка создания поста');
                    }
                } catch (error) {
                    console.error('Ошибка создания поста:', error);
                    this.showToast(`❌ Ошибка: ${error.message}`, 'error');
                    return false;
                } finally {
                    if (submitBtn) {
                        submitBtn.textContent = originalBtnText;
                        submitBtn.disabled = false;
                    }
                }
            }

            clearSelection() {
                this.selectedPictureIds = [];
                document.querySelectorAll('.gallery-item').forEach(item => {
                    item.classList.remove('selected');
                });
                this.updateSelectionUI();
                this.showToast('Выбор очищен', 'info');
            }

            showToast(message, type = 'info') {
                const toast = document.getElementById('toast');
                if (!toast) return;

                toast.textContent = message;
                toast.className = `toast ${type}`;
                toast.classList.add('show');

                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            getCookie(name) {
                let cookieValue = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, name.length + 1) === (name + '=')) {
                            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                            break;
                        }
                    }
                }
                return cookieValue;
            }
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            new PostCreator();
        });
    </script>
</body>
</html>
