<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список профилей</title>
    <style>
        .profile-card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Зарегистрированные пользователи</h1>

    {% if posts %}
        <h4>Посты:</h4>
        <ul>
        {% for post in posts %}
                <li>{{ post.title }}</li>
            {% for images in post.pictures %}
                <li ><img src="{{ images.image }}" width="200" height="200"></li>
            {% endfor %}
        {% endfor %}
        </ul>
        <hr>
        {% else %}
    {% endif %}
</body>
</html>
